name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest macfabric_gateway/tests/ -q

  app-contracts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-app-contracts.sh
