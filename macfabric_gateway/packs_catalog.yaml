    source_page: "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX"
    manifest:
      pack_id: tts.kokoro-82m-onnx
      pack_version: 1.0.0
      capability: tts
      model: {id: kokoro-82m, parameter_count_b: 1, quantization: fp32-onnx, license: apache-2.0}
      runtime: {engine: tts_server, runtime_template: kokoro-onnx-macos-arm64-v1}
      resources: {download_mb: 400, disk_mb: 600, peak_memory_mb: 800, gpu_role: none}
      lifecycle: {mode: on_demand}
      network: {listen: loopback, allowed_upstream: []}
      artifacts:
        - {id: model, kind: model, source: "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model.onnx", sha256: "8fbea51ea711f2af382e88c833d9e288c6dc82ce5e98421ea61c058ce21a34cb"}  # HF LFS x-linked-etag 2026-11-15
      execution: {model_config_template: tts_server_v1, healthcheck: tts_ready_v1}
      sandbox: {policy: verified-local-pack-v1, degraded_install_allowed: true}

  - pack_id: ocr.macos-vision
    display_name: macOS Vision OCR
    summary: 系统内置 OCR（Apple Vision 框架，只读调用，无需下载）
    tags: [ocr, builtin, zero-download]
    risk_level: verified
    builtin: true
    source_page: "https://developer.apple.com/documentation/vision"
    manifest:
      pack_id: ocr.macos-vision
      pack_version: 1.0.0
      capability: ocr
      model: {id: macos-vision, parameter_count_b: 1, quantization: builtin, license: apple-system-framework}
      runtime: {engine: macos_vision_cli, runtime_template: macos-vision-v1}
      resources: {download_mb: 1, disk_mb: 1, peak_memory_mb: 200, gpu_role: none}
      lifecycle: {mode: on_demand}
      network: {listen: loopback, allowed_upstream: []}
      artifacts: []
      execution: {model_config_template: macos_vision_builtin_v1, healthcheck: vision_available_v1}
      sandbox: {policy: verified-local-pack-v1, degraded_install_allowed: true}
