# MacFabric 捆绑能力目录（Catalog）— spec §6.1/§11
# 首批冻结 5 项（2026-11-15 裁决）：Qwen3-4B-Instruct-2507（首个完整试点）、
# BGE-M3、Whisper large-v3-turbo、Kokoro ONNX、macOS Vision。
# Gemma 许可证复核前不得进入本目录。
# sha256 均为 2026-11-15 冻结的真实值：模型取自 HF LFS x-linked-etag，
# 引擎为本机下载实测（见各行尾注）。本目录随应用发布；能力包安装只接受
# 此处 pack_id，URL/hash 由后端提供。
# 注意：whisper/kokoro 的 asr_server_v1/tts_server_v1 运行时模板属 PK5
# 批次，未实现前安装会在 preflight 被拒（model_config_template_not_implemented）。
packs:
  - pack_id: llm.qwen3-4b-instruct-2507
    display_name: Qwen3-4B Instruct (2507)
    summary: 通用基线端侧 LLM，中英多语，支持工具调用；本批首个完整试点包
    tags: [chat, tools, multilingual]
    risk_level: verified
    builtin: false
    source_page: "https://huggingface.co/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF"
    manifest:
      pack_id: llm.qwen3-4b-instruct-2507
      pack_version: 1.0.0
      capability: llm
      model: {id: qwen3-4b-instruct-2507, parameter_count_b: 4, quantization: q4_k_m, license: apache-2.0}
      runtime: {engine: llama_cpp, runtime_template: llama-cpp-macos-arm64-v1}
      resources: {download_mb: 3200, disk_mb: 3400, peak_memory_mb: 4800, gpu_role: shared}
      lifecycle: {mode: on_demand}
      network: {listen: loopback, allowed_upstream: []}
      artifacts:
        - {id: model, kind: model, source: "https://huggingface.co/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf", sha256: "8cdb57cbb880d313736a9bc4e3d3d2485f145b5e19cf33783746e753e82641fc"}  # HF LFS x-linked-etag 2026-11-15
        - {id: engine, kind: runtime, source: "https://github.com/ggml-org/llama.cpp/releases/download/b12361/llama-b12361-bin-macos-arm64.tar.gz", sha256: "0317a41e685e4d577fa55050204f7165fc62600f893e0d1a4e2bed91f1963b87"}  # 本机下载实测 2026-11-15
      execution: {model_config_template: llama_cpp_chat_v1, healthcheck: openai_chat_ready_v1}
      sandbox: {policy: verified-local-pack-v1, degraded_install_allowed: true}

  - pack_id: embedding.bge-m3
    display_name: BGE-M3 Embedding
    summary: 多语 dense + 混合检索嵌入模型
    tags: [embedding, retrieval, multilingual]
    risk_level: verified
    builtin: false
    source_page: "https://huggingface.co/BAAI/bge-m3"
    manifest:
      pack_id: embedding.bge-m3
      pack_version: 1.0.0
      capability: embedding
      model: {id: bge-m3, parameter_count_b: 1, quantization: q8_0, license: mit}
      runtime: {engine: llama_cpp, runtime_template: llama-cpp-macos-arm64-v1}
      resources: {download_mb: 2400, disk_mb: 2600, peak_memory_mb: 2200, gpu_role: shared}
      lifecycle: {mode: on_demand}
      network: {listen: loopback, allowed_upstream: []}
      artifacts:
        - {id: model, kind: model, source: "https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf", sha256: "950f4a8e5e19477a6d3c26d2f162233c20002c601f75e4b002e3239997821167"}  # HF LFS x-linked-etag 2026-11-15
        - {id: engine, kind: runtime, source: "https://github.com/ggml-org/llama.cpp/releases/download/b12361/llama-b12361-bin-macos-arm64.tar.gz", sha256: "0317a41e685e4d577fa55050204f7165fc62600f893e0d1a4e2bed91f1963b87"}  # 本机下载实测 2026-11-15
      execution: {model_config_template: llama_cpp_chat_v1, healthcheck: openai_chat_ready_v1}
      sandbox: {policy: verified-local-pack-v1, degraded_install_allowed: true}

  - pack_id: asr.whisper-large-v3-turbo
    display_name: Whisper large-v3-turbo
    summary: 多语语音识别（whisper.cpp，Metal 加速）
    tags: [asr, multilingual, streaming-off]
    risk_level: verified
    builtin: false
    source_page: "https://huggingface.co/ggerganov/whisper.cpp"
    manifest:
      pack_id: asr.whisper-large-v3-turbo
      pack_version: 1.0.0
      capability: asr
      model: {id: whisper-large-v3-turbo, parameter_count_b: 1, quantization: q5_0, license: mit}
      runtime: {engine: asr_server, runtime_template: whisper-cpp-macos-arm64-v1}
      resources: {download_mb: 1700, disk_mb: 1900, peak_memory_mb: 2200, gpu_role: shared}
      lifecycle: {mode: on_demand}
      network: {listen: loopback, allowed_upstream: []}
      artifacts:
        - {id: model, kind: model, source: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin", sha256: "1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69"}  # HF LFS x-linked-etag 2026-11-15
      execution: {model_config_template: asr_server_v1, healthcheck: asr_ready_v1}
      sandbox: {policy: verified-local-pack-v1, degraded_install_allowed: true}

  - pack_id: tts.kokoro-82m-onnx
