# MacFabric P0/P1 基线模型 — Qwen3-4B Q4_K_M via llama-server (Metal)
# P1: binary_path 显式配置（Metal 构建第一公民）+ --alias 规范化 model 回显
# P1 后续: 迁移为 mem_baseline_mb/mode/idle_timeout_min 三字段账本模型
name: qwen3-4b
description: "Qwen3-4B Q4_K_M — 基线对话模型 (llama-server Metal offload)"
type: llama_cpp
gpu_role: shared
model_type: llm
peak_vram_mb: 3100
served_name: qwen3-4b
anthropic_native: true   # llama-server b12361 原生 /v1/messages → 透传（翻译桥供 vLLM/MLX 等用）
# G1 内存账本三字段（D2/D3）：B = RAM − 8G 单一预算下准入
mem_baseline_mb: 3100
mode: on_demand          # 模型不默认启动：首请求自动唤醒（设计稿：已停止照样能调）
idle_timeout_min: 30
llama_cpp:
  model_path: /Users/Apple/Documents/MacFabric/models/Qwen3-4B-Q4_K_M.gguf
  binary_path: /Users/Apple/Documents/MacFabric/engines/llama-b12361/llama-server
  port: 8010
  threads: 8
  context_size: 16384
  gpu_layers: 99
  extra_flags: "--alias qwen3-4b --jinja"
