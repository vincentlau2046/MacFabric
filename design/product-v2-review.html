<body>
<header class="review">
 <div><h1>MacFabric · 三页视觉样稿</h1><p>仅供设计审核；以下模型、资源、鉴权与验证状态均为示例，不连接网关。</p></div>
 <div class="review-controls">
  <nav class="segmented page-tabs" aria-label="样稿页面"><button data-page="local" class="active">本地推理</button><button data-page="packs">能力包</button><button data-page="hub">模型服务</button></nav>
  <div class="row"><span class="review-label">预览</span><div class="segmented" aria-label="窗口宽度"><button data-width="wide" class="active">宽窗</button><button data-width="narrow">窄窗</button></div><div class="segmented" aria-label="主题"><button data-theme="light" class="active">浅色</button><button data-theme="dark">深色</button></div></div>
 </div>
</header>
<div class="app" id="app">
 <aside class="sidebar">
  <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="nav-label">工作台</div><nav id="sidebar-nav" aria-label="应用导航"></nav>
  <div class="sidebar-bottom"><strong>Apple Silicon 工作台</strong><div>36 GiB 机型 · 布局示例</div><div style="margin-top:10px"><span class="demo-pill">设计评审 · 非运行界面</span></div></div>
 </aside>
 <main class="workspace" id="workspace">
  <div class="windowbar"><div class="breadcrumb">工作台 <span>／</span><b id="breadcrumb">本地推理</b></div><div class="window-tools"><span class="connection"><i class="dot green"></i>本机网关 · 示例</span><button class="icon-button" data-demo="刷新" title="刷新示例" aria-label="刷新示例" id="refresh-button"></button></div></div>
  <div id="page-top"></div>
  <div class="workspace-body"><section class="list-pane" aria-label="模型列表"><div class="table"><div id="table-head"></div><div class="table-scroll" id="table-body"></div><div class="table-footer" id="table-footer"></div></div><div class="list-note" id="list-note"></div></section><aside class="inspector" id="inspector" aria-label="选中模型详情"></aside></div>

 </main>
</div>
<section class="review-notes" id="review-notes" aria-label="本页审核重点"></section>
<p class="review-disclaimer">本页是 HTML 视觉评审稿，不是 SwiftUI 实现，也不是原生 GUI 验收证据。可切换三页、主题和窗口宽度，点击模型查看详情；所有操作仅在样稿内演示，不请求网络、不接收或保存密钥。</p>

let current='local',widthMode='wide',selected='bge',detailOpen=window.innerWidth>=1700,query='',typeFilter='all',stateFilter='all',stale=false,expanded=new Set(),toastTimer,previousFocus;
const $=s=>document.querySelector(s);

function closeModal(){$('#modal-backdrop').hidden=true;previousFocus?.focus()}

function visibleModels(){let list=current==='local'?models.slice(0,6):current==='hub'?models.filter(m=>['qwen4','bge','coder3','vl2','glm5','glm5flash','gptsol','seedream'].includes(m.id)):models;return list.filter(m=>(!query||(m.name+' '+m.caps.join(' ')).toLowerCase().includes(query.toLowerCase()))&&(typeFilter==='all'||m.type===typeFilter)&&(stateFilter==='all'||m.state===stateFilter))}
function searchField(){return `<label class="search">${icon('search')}<input id="search" aria-label="搜索模型" placeholder="搜索模型或能力" value="${esc(query)}"></label>`}

 $('#breadcrumb').textContent=titles[current];

 let action=current==='packs'?`<button class="primary row" id="add-model">${icon('plus')}添加模型链接</button>`:current==='hub'?'<button id="auth-demo" class="plain sub">查看失联状态样式</button>':'<button class="row" data-go-packs>查看能力包 '+icon('chevron')+'</button>';
 let html=`<header class="page-heading"><div><h2>${titles[current]}</h2><p>${heading}</p></div>${action}</header>`;

 }
 html+=`<div class="toolbar">${searchField()}${current!=='packs'?typeSelect():''}${current==='local'?`<select class="filter" id="state-filter" aria-label="按运行状态筛选"><option value="all">全部运行状态</option>${['可用','未加载','已睡眠','加载中','异常'].map(s=>`<option ${stateFilter===s?'selected':''}>${s}</option>`).join('')}</select>`:''}${current==='packs'?'<select class="filter" id="eligibility-filter" aria-label="目录范围"><option value="all">全部目录</option><option value="eligible">仅可安装</option></select>':''}<span class="toolbar-spacer"></span><button class="icon-button detail-toggle" id="toggle-detail" aria-label="切换详情面板" title="切换详情">${icon('hub')}</button></div>`;
 if(current==='packs')html+=`<div class="type-tabs" aria-label="能力分类"><button data-type="all" class="${typeFilter==='all'?'active':''}">全部 <span class="muted">12</span></button>${Object.entries(typeNames).map(([k,v])=>`<button data-type="${k}" class="${typeFilter===k?'active':''}">${v} <span class="muted">${models.filter(m=>m.type===k).length}</span></button>`).join('')}<button data-roadmap>其他能力 · 规划中</button></div>`;

 $('#eligibility-filter')?.addEventListener('change',()=>renderRows());

 $('#add-model')?.addEventListener('click',()=>modal('添加模型链接',`<p>先识别型号与类型，再确认资源和缺失依赖。不需要填写能力包编号。</p><input aria-label="下载链接示例" placeholder="https://modelscope.cn/…/model.gguf" autocomplete="off"><p>此处仅展示交互结构，不发送链接、不下载或安装。</p><button class="primary" style="margin-top:16px" data-demo="链接识别预览">预览识别结果</button>`));

function renderRows(){
 let list=visibleModels();if(current==='packs'&&$('#eligibility-filter')?.value==='eligible')list=list.filter(m=>m.compat==='可安装');
 const head=current==='local'?['模型名称','类型','能力','运行状态','内存基线','操作']:current==='packs'?['模型名称','能力','变体','下载体积','兼容性','验证','安装状态','操作']:['模型名称','类型','来源','可用状态','接入'];
 const classes=current==='local'?['','', 'cap-col','','memory-col num','actions']:current==='packs'?['','cap-col','variant-col','size-col num','compat-col','verification-col','','actions']:['','','source-col','','actions'];
 $('#table-head').innerHTML=`<div class="grid-row head ${current==='packs'?'catalog':current}">${head.map((s,i)=>`<span class="${classes[i]}">${s}</span>`).join('')}</div>`;
 let out='';
 if(current==='packs'){
 for(const type of Object.keys(typeNames)){let group=list.filter(m=>m.type===type);if(!group.length)continue;out+=`<div class="group-title">${icon(type)}${typeNames[type]}<span>${group.length} 个型号</span></div>`;let shown=typeFilter!=='all'||query||expanded.has(type)?group:group.slice(0,2);out+=shown.map(rowMarkup).join('');if(shown.length<group.length)out+=`<button class="expand-group" data-expand="${type}">展开其余 ${group.length-shown.length} 个型号</button>`}
 }else{out=list.map(rowMarkup).join('');if(current==='hub'&&typeFilter==='all'&&!query)out+=`<div class="group-title">${icon('pools')}模型池 · 独立路由服务<span>同类能力聚合 · 集中配置 · 调整一次对多 Agent 生效</span></div>${poolRow('快速对话','fabric-fast')}${poolRow('轻量任务','fabric-small')}`}
 $('#table-body').innerHTML=out||'<div class="empty">没有匹配的模型。试试其他名称或类型。</div>';
 $('#table-footer').innerHTML=`<span>${current==='packs'?`12 个精选目标 · 筛选结果 ${list.length} 个`:`${list.filter(m=>!m.cloud).length} 个本地示例 · ${list.filter(m=>m.cloud).length} 个云端示例${current==='hub'?' · 2 个逻辑池示例':''}`}</span><span>点击行查看${current==='hub'?'接入配置':'完整资料'}</span>`;

 document.querySelectorAll('[data-select]').forEach(row=>{const pick=()=>{selected=row.dataset.select;detailOpen=true;renderRows();renderInspector();updateInspectorLayout()};row.addEventListener('click',pick);row.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pick()}})});

 updateInspectorLayout();

function rowMarkup(m){const select=`data-select="${m.id}" tabindex="0" role="button" aria-label="查看 ${esc(m.name)} 的${current==='hub'?'接入配置':'详情'}"`;const name=`<div title="${esc(m.name)}"><div class="model-name">${esc(m.name)}</div>${current==='hub'?`<div class="model-caption">${m.caps.join(' / ')}</div>`:''}</div>`;let cells='';if(current==='local'){let action=m.state==='可用'?'测试':m.state==='已睡眠'?'唤醒':m.state==='异常'?'查看':m.state==='加载中'?'加载中':'加载';cells=`${name}<span class="type-label">${icon(m.type)}${typeNames[m.type]}</span><span class="cap-col capabilities">${m.caps.map(esc).join(' / ')}</span><span>${status(m.state)}</span><span class="memory-col num sub">${m.memory}</span><span class="actions"><button data-action-model="${m.id}" ${m.state==='加载中'?'disabled':''}>${action}</button><button class="more" data-select-action="${m.id}" aria-label="${esc(m.name)} 更多操作">⋯</button></span>`}

function renderInspector(){let m=selectedModel(),html=`<header class="inspector-title"><span>${current==='hub'?'接入详情':current==='packs'?'模型资料':'运行详情'}</span><button class="icon-button" id="close-detail" aria-label="关闭详情">${icon('close')}</button></header><section class="detail-intro"><div class="detail-icon">${icon(m.type)}</div><h3>${esc(m.name)}</h3><p>${typeNames[m.type]}${m.cloud?` · ${m.source}`:m.id==='bge'?' · BAAI':m.name.startsWith('Qwen')?' · Qwen':''}</p><div class="detail-tags">${m.caps.map(c=>`<span class="tag blue">${esc(c)}</span>`).join('')}${m.id==='bge'?'<span class="tag">Dense 向量</span>':''}</div></section>`;
 if(current==='local'){
 html+=detailSection('运行与装载',kv([['当前状态',status(m.state)],['装载方式',m.type==='embedding'||m.type==='rerank'?'常驻':'按需'],['自动启动','关闭'],['空闲回收',m.type==='embedding'||m.type==='rerank'?'不自动回收':'30 分钟 · 已有配置'],['内存基线',m.memory],['实测内存',m.state==='可用'?'4.3 GiB · 示例':'尚未采样']])+`<div class="small-actions"><button data-demo="装载策略设置">调整装载策略</button></div>`);
 html+=detailSection('能力测试',`<p class="body-copy">${m.type==='embedding'?'输入两段文本，比较向量与语义相似度。不是聊天窗口。':m.type==='rerank'?'输入查询与文档列表，核对排序与原始索引。':m.type==='vl'?'上传图片并提问，核对回答是否与图像相关。':'输入问题，检查真实正文与流式完成状态。'}</p><button style="margin-top:11px" data-demo="${typeNames[m.type]}测试">${m.type==='embedding'?'测试嵌入':m.type==='rerank'?'测试重排':m.type==='vl'?'测试图片问答':'测试对话'}</button>`);
 if(m.state==='异常')html+=detailSection('需要处理',`<p class="body-copy" style="color:var(--red)">缺少匹配的视觉投影文件（示例）。</p><button style="margin-top:10px" data-demo="投影文件检查">检查依赖</button>`);
 html+=installationDetails(m)+technicalDetails(m);
 }else if(current==='packs'){
 html+=detailSection('安装条件',kv([['兼容性',`<span class="${m.compat==='需适配'?'auth-stale':'auth-ok'}">${m.compat}</span>`],['验证状态',m.verify],['变体',m.variant],['下载体积',m.download],['安装占用',m.id==='bge'?'约 1.2 GiB':'待冻结'],['内存需求',m.memory]]));
 html+=detailSection('能力边界',`<p class="body-copy">${m.id==='bge'?'用于多语言文本检索。当前展示 Dense 向量能力，不扩大为 Sparse 或多向量检索。':'此型号属于已规划候选。产物、模板、许可和语义验证完成前，不展示可安装承诺。'}</p><p class="detail-note">验证状态仅为样稿示例；正式界面应可打开对应测试证据。</p><button class="text-link" data-demo="验证记录" style="margin-top:7px">查看验证记录</button>`);
 html+=installationDetails(m)+technicalDetails(m);
 }else{
 const endpoint=m.type==='embedding'?'/v1/embeddings':m.type==='rerank'?'/v1/rerank':m.type==='aigc'?'/v1/images/generations':'/v1/chat/completions';
 html+=detailSection('调用配置',`<div class="sub" style="font-size:10px">公开调用 ID</div><div class="path">${esc(m.api)}</div><div class="endpoint-chip">POST ${endpoint}</div><p class="detail-note">${m.cloud?`云端模型 · ${m.source}，密钥由网关持有，客户端只需网关地址与网关 Key。`:m.type==='embedding'?'文本嵌入不生成聊天或 Anthropic 配置。':m.type==='rerank'?'重排请求使用 query 与 documents。':m.type==='vl'?'视觉请求包含图像输入。':m.type==='aigc'?'图像生成走 images 端点。':'对话支持按实际能力生成协议示例。'}</p>`);
 html+=detailSection('cURL 示例',`<pre class="example-code" id="example-code">${esc(exampleFor(m))}</pre><div class="small-actions"><button id="copy-example">${icon('copy')} 复制示例</button></div><p class="detail-note">示例仅含环境变量占位符，不含已保存密钥。${m.type==='vl'?'图片位置需要替换为真实 Base64。':''}</p>`);
 html+=detailSection('App 内试用',`<p class="body-copy">录入网关调用密钥后即可${m.type==='embedding'?'测试文本嵌入':m.type==='rerank'?'测试文档排序':m.type==='vl'?'测试图片问答':'试用对话'}。网关密钥与云服务商密钥是两种凭证。</p><button data-key-open style="margin-top:10px">设置调用密钥</button>`);
 }
 $('#inspector').innerHTML=html;
 $('#close-detail').addEventListener('click',()=>{detailOpen=false;updateInspectorLayout()});
 $('#copy-example')?.addEventListener('click',()=>copyText(exampleFor(m)));
}
function installationDetails(m){return detailSection(current==='packs'?'安装位置':'部署位置',`<div class="sub" style="font-size:10px">${m.installed?'已安装路径':'预设位置 · 安装前可见'}</div><div class="path">~/.inferfabric/packs/<br>${esc(m.pack)}/1.0.0/</div><div class="small-actions"><button data-copy-path="${esc(m.pack)}">复制路径</button><button data-demo="在 Finder 中显示">在 Finder 中显示</button></div><p class="detail-note">预设路径示例，正式界面取实际安装结果。</p>`)}
function technicalDetails(m){return `<div class="detail-bottom"><details><summary>技术信息</summary>${kv([['运行底座','llama.cpp · Metal'],['引擎版本','b12361 · 回归基线']])}<div class="tech-code">包 ID：${esc(m.pack)}<br>包版本：1.0.0<br>实例 ID：pack-${esc(m.api)}-1-0-0<br>调用 ID：${esc(m.api)}</div></details></div>`}
function updateInspectorLayout(){
 const workspace=$('#workspace');const body=$('.workspace-body');const narrow=body.clientWidth<1450;
 workspace.classList.toggle('overlay',narrow&&detailOpen);$('#inspector').hidden=!detailOpen;
 let scrim=$('#detail-scrim');if(narrow&&detailOpen){if(!scrim){scrim=document.createElement('div');scrim.className='scrim';scrim.id='detail-scrim';scrim.addEventListener('click',()=>{detailOpen=false;updateInspectorLayout()});workspace.append(scrim)}}else scrim?.remove();
}
function renderNotes(){let notes=current==='local'?[['先读型号，再看能力','主行只保留可比较的信息。包编号、端口和启动开关退到详情，不再把一排标签挤进模型名称。'],['表头与每行共用列线','状态、内存和动作位置固定；资源数值右对齐。窄窗收起次要列，详情改为覆盖式检查器。'],['运行管理与删除部署分开','加载、唤醒与分型测试是日常动作；释放内存和卸载能力包不再使用同一个含混的“卸载”。']]:current==='packs'?[['按类型组织，不再堆卡片','精选目标归入文本生成、嵌入、重排、视觉四类。分类数量可见，同类型号在同一列线内比较。'],['兼容、验证、安装各有一列','“需适配”不是安装失败，“已安装”不代表语义已验证。未通过的候选只能查看条件，不能假装一键可用。'],['安装信息退到选中项','变体、内存需求、完整路径和能力边界集中解释。用户添加以下载链接开始，不要求填写 pack 名称。']]:[['本地与云端同页按类型分类','云端模型（示例：GLM-5、Seedream-4.0）与本地模型在同一表格按类型比较，来源列区分两侧；云端行原样保留上游调用 ID。'],['模型池是独立路由服务','同类能力聚合成统一路由，集中配置候选与顺序；调整一次即对调用它的多个 Agent 生效。池以逻辑 ID 分组呈现，不与单个模型混为一类。'],['按能力生成正确端点与示例','BGE-M3 展示嵌入配置而不是聊天示例；云端模型按其实际协议生成。示例只引用密钥占位符，不收集或存储任何真实密钥。']];$('#review-notes').innerHTML=notes.map(([h,p])=>`<article><h3>${h}</h3><p>${p}</p></article>`).join('')}
function render(){renderNav();renderTop();renderRows();renderInspector();renderNotes();updateInspectorLayout();document.getElementById('app').classList.toggle('page-packs',current==='packs');document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===current);b.setAttribute('aria-pressed',String(b.dataset.page===current))})}
function changePage(page){if(!titles[page]){toast('本次仅提供本地推理、能力包、模型服务三页样稿。');return}current=page;selected='bge';query='';typeFilter='all';stateFilter='all';detailOpen=widthMode==='wide';expanded.clear();history.replaceState(null,'','#'+page);render()}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制示例内容，不含真实密钥。')}catch{modal('复制示例',`<p>当前浏览器不允许自动复制，可选中下方文本手动复制。</p><pre class="example-code" tabindex="0">${esc(text)}</pre>`)}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page)changePage(t.dataset.page);if(t.dataset.nav)changePage(t.dataset.nav);if(t.dataset.theme){document.documentElement.dataset.theme=t.dataset.theme;document.querySelectorAll('button[data-theme]').forEach(b=>{b.classList.toggle('active',b===t);b.setAttribute('aria-pressed',String(b===t))})}if(t.dataset.width){widthMode=t.dataset.width;$('#app').classList.toggle('narrow',widthMode==='narrow');document.querySelectorAll('[data-width]').forEach(b=>{b.classList.toggle('active',b===t);b.setAttribute('aria-pressed',String(b===t))});detailOpen=widthMode==='wide';requestAnimationFrame(updateInspectorLayout)}if(t.hasAttribute('data-go-packs'))changePage('packs');if(t.dataset.demo)toast(`仅演示“${t.dataset.demo}”，不会执行实际操作。`);if(t.dataset.actionModel){const m=models.find(m=>m.id===t.dataset.actionModel);selected=m.id;detailOpen=true;renderRows();renderInspector();updateInspectorLayout();toast(`“${m.name}”操作仅为样稿，不加载或推理。`)}if(t.dataset.selectAction){selected=t.dataset.selectAction;detailOpen=true;renderRows();renderInspector();updateInspectorLayout()}if(t.hasAttribute('data-key-open'))$('#key-demo')?.click();if(t.hasAttribute('data-roadmap'))modal('其他能力规划',`<p>文字识别、语音识别、语音合成、图像生成进入整体蓝图。各类运行底座、来源和许可方案单独审核，不在本轮伪装成可安装库存。</p>`);if(t.dataset.pool)modal('模型池接入',`<p>逻辑模型名称与具体模型分开管理。</p><div class="path">调用 ID：${esc(t.dataset.pool)}<br>端点：/v1/chat/completions<br>API Key：YOUR_GATEWAY_API_KEY</div><p style="margin-top:10px">示例不会调用真实模型池。</p>`);if(t.hasAttribute('data-copy-base'))copyText('http://127.0.0.1:8999/v1');if(t.dataset.copyPath)copyText('~/.inferfabric/packs/'+t.dataset.copyPath+'/1.0.0/')});
$('#close-modal').addEventListener('click',closeModal);$('#modal-backdrop').addEventListener('click',e=>{if(e.target===$('#modal-backdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal-backdrop').hidden)closeModal();else{detailOpen=false;updateInspectorLayout()}}if(e.key==='Tab'&&!$('#modal-backdrop').hidden){const all=Array.from($('#modal-backdrop').querySelectorAll('button,input,[tabindex="0"]'));if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});
$('#refresh-button').innerHTML=icon('refresh');
if(titles[location.hash.slice(1)])current=location.hash.slice(1);
document.documentElement.dataset.theme='light';
new ResizeObserver(()=>updateInspectorLayout()).observe($('#app'));
render();
</script>
</body>
</html>
